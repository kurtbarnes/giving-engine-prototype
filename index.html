<script type="text/plain" data-module="app-core.js">
const { useState, useMemo, useEffect } = React;

/* ============================================================
   MOCK DATA
   ============================================================ */
const ORGS = {
  classic: {
    id: "classic", name: "Riverbend Humane Society", initials: "RH",
    tmplName: "Classic NXT", tmplDesc: "A close visual match to today's Raiser's Edge NXT donation form \u2014 familiar for migrating organizations.",
    thumbGrad: "linear-gradient(135deg,#1B4B8F,#0E2E5C)",
    designations: [
      { id: "where", name: "Where Needed Most" },
      { id: "shelter", name: "Shelter Medical Fund" },
      { id: "foster", name: "Foster Program" },
      { id: "spay", name: "Spay & Neuter Fund" },
      { id: "other", name: "Other" },
    ],
    amounts: [25, 50, 100, 250, 500, 1000],
  },
  minimal: {
    id: "minimal", name: "Bright Futures Youth Center", initials: "BF",
    tmplName: "Minimal Checkout", tmplDesc: "Zeffy-inspired: short, mobile-first, generous white space, minimal fields visible at once.",
    thumbGrad: "linear-gradient(135deg,#FF6B4A,#7A2E1D)",
    designations: [
      { id: "general", name: "General Fund" },
      { id: "afterschool", name: "After-School Program" },
      { id: "camp", name: "Summer Camp Scholarships" },
    ],
    amounts: [15, 35, 75, 150],
  },
  story: {
    id: "story", name: "Coastal Land Trust", initials: "CL",
    tmplName: "Story Page", tmplDesc: "Raisely-inspired standalone landing page: hero narrative, goal meter, docked checkout card.",
    thumbGrad: "linear-gradient(135deg,#2F5D50,#12241F)",
    designations: [
      { id: "conservation", name: "Conservation Fund" },
      { id: "trail", name: "Trail Restoration" },
      { id: "land", name: "Land Acquisition" },
    ],
    amounts: [50, 100, 250, 500],
    goal: { raised: 185400, target: 250000 },
  },
  modal: {
    id: "modal", name: "City Symphony", initials: "CS",
    tmplName: "Modal Overlay", tmplDesc: "Fundraise Up-inspired: zero-redirect overlay triggered from a Donate button on the org's own site.",
    thumbGrad: "linear-gradient(135deg,#6D4AFF,#241C3C)",
    designations: [
      { id: "annual", name: "Annual Fund" },
      { id: "education", name: "Education & Outreach" },
      { id: "endowment", name: "Endowment" },
    ],
    amounts: [50, 100, 250, 1000],
  },
  split: {
    id: "split", name: "United Regional Food Bank", initials: "UF",
    tmplName: "Split Designation", tmplDesc: "Purpose-built for one payment allocated across several funds at once, with amount entry per fund.",
    thumbGrad: "linear-gradient(135deg,#C1440E,#1B2A4A)",
    designations: [
      { id: "sourcing", name: "Food Sourcing", desc: "$0.10 provides one meal equivalent" },
      { id: "mobile", name: "Mobile Pantry", desc: "Delivers to rural routes" },
      { id: "nutrition", name: "Nutrition Education", desc: "Classes & cooking demos" },
      { id: "facilities", name: "Facilities Fund", desc: "Warehouse & refrigeration" },
    ],
    amounts: [50, 100, 250, 500],
  },
};
const TEMPLATE_ORDER = ["classic", "minimal", "story", "modal", "split"];

function fmtMoney(n) {
  return "$" + Number(n).toLocaleString("en-US", { maximumFractionDigits: 0 });
}

/* ---- gift history mock rows ---- */
const FIRST_NAMES = ["Maria", "James", "Linda", "Robert", "Susan", "David", "Karen", "Michael", "Nancy", "Thomas", "Betty", "Carlos", "Aisha", "Wei", "Priya"];
const LAST_NAMES = ["Alvarez", "Nguyen", "Johnson", "Smith", "Patel", "Brown", "Garcia", "Chen", "Williams", "Davis", "Martinez", "Lee", "Clark", "Robinson"];
const STATUSES = ["settled", "settled", "settled", "settled", "pending", "failed", "refunded"];
const TYPES = ["one_time", "one_time", "recurring", "recurring", "pledge_payment"];
const ALL_DESIGNATIONS = ["Where Needed Most", "Shelter Medical Fund", "Annual Fund", "General Fund", "Conservation Fund", "Food Sourcing"];

function seedRandom(seed) {
  let s = seed;
  return () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
}
const rand = seedRandom(42);

const MOCK_GIFTS = Array.from({ length: 48 }).map((_, i) => {
  const first = FIRST_NAMES[Math.floor(rand() * FIRST_NAMES.length)];
  const last = LAST_NAMES[Math.floor(rand() * LAST_NAMES.length)];
  const status = STATUSES[Math.floor(rand() * STATUSES.length)];
  const type = TYPES[Math.floor(rand() * TYPES.length)];
  const amount = [25, 50, 75, 100, 150, 250, 500, 1000][Math.floor(rand() * 8)];
  const daysAgo = Math.floor(rand() * 45);
  const d = new Date(); d.setDate(d.getDate() - daysAgo);
  return {
    id: "GFT-" + (10450 + i),
    donor: `${first} ${last}`,
    email: `${first.toLowerCase()}.${last.toLowerCase()}@example.com`,
    amount, status, type,
    designation: ALL_DESIGNATIONS[Math.floor(rand() * ALL_DESIGNATIONS.length)],
    date: d.toISOString().slice(0, 10),
    txId: "rf_" + Math.random().toString(36).slice(2, 10),
    synced: rand() > 0.12,
  };
});

/* ---- donor directory (derived from gift history) ---- */
const STREETS = ["Maple Ave", "Oak St", "Sunset Blvd", "Cedar Ln", "5th Ave", "Elm St", "River Rd", "Highland Dr", "Park Pl", "Birch Way"];
const CITIES = [["Portland", "OR", "972"], ["Austin", "TX", "787"], ["Denver", "CO", "802"], ["Raleigh", "NC", "276"], ["Columbus", "OH", "432"], ["Sacramento", "CA", "958"], ["Madison", "WI", "537"], ["Richmond", "VA", "232"]];
const RECUR_FREQS = ["monthly", "monthly", "monthly", "quarterly", "annual"];

function futureDate(minDays, maxDays) {
  const d = new Date();
  d.setDate(d.getDate() + minDays + Math.floor(rand() * (maxDays - minDays)));
  return d.toISOString().slice(0, 10);
}

function buildDonors() {
  const byEmail = new Map();
  MOCK_GIFTS.forEach((g) => {
    if (!byEmail.has(g.email)) byEmail.set(g.email, []);
    byEmail.get(g.email).push(g);
  });

  let i = 0;
  const donors = [];
  for (const [email, gifts] of byEmail.entries()) {
    i++;
    const sortedGifts = [...gifts].sort((a, b) => b.date.localeCompare(a.date));
    const oldestFirst = [...gifts].sort((a, b) => a.date.localeCompare(b.date));
    const settled = gifts.filter((g) => g.status === "settled");
    const totalGiving = settled.reduce((a, g) => a + g.amount, 0);
    const largestGift = gifts.reduce((m, g) => Math.max(m, g.amount), 0);
    const city = CITIES[Math.floor(rand() * CITIES.length)];

    const recurringSource = gifts.find((g) => g.type === "recurring");
    const recurringGifts = recurringSource ? [{
      id: "RG-" + (5000 + i),
      designation: recurringSource.designation,
      amount: recurringSource.amount,
      frequency: RECUR_FREQS[Math.floor(rand() * RECUR_FREQS.length)],
      status: rand() > 0.15 ? "active" : "paused",
      startDate: oldestFirst[0].date,
      nextChargeDate: futureDate(1, 28),
    }] : [];

    const pledgeGifts = gifts.filter((g) => g.type === "pledge_payment");
    const pledges = pledgeGifts.length ? (() => {
      const paid = pledgeGifts.reduce((a, g) => a + g.amount, 0);
      const totalPledged = paid + (Math.round((paid * (0.5 + rand() * 1.5)) / 50) * 50 || 50);
      return [{
        id: "PLG-" + (7000 + i),
        designation: pledgeGifts[0].designation,
        totalPledged,
        totalPaid: paid,
        balance: totalPledged - paid,
        installments: pledgeGifts.length,
        nextDueDate: futureDate(7, 60),
      }];
    })() : [];

    const syncedCount = gifts.filter((g) => g.synced).length;
    const reSynced = syncedCount === gifts.length ? "synced" : syncedCount === 0 ? "pending" : "partial";

    donors.push({
      id: "DNR-" + (30000 + i),
      name: gifts[0].donor,
      email,
      phone: "(" + (200 + Math.floor(rand() * 700)) + ") " + (200 + Math.floor(rand() * 700)) + "-" + (1000 + Math.floor(rand() * 8999)),
      address: {
        line1: (100 + Math.floor(rand() * 8899)) + " " + STREETS[Math.floor(rand() * STREETS.length)],
        city: city[0], state: city[1], zip: city[2] + Math.floor(10 + rand() * 89),
      },
      gifts: sortedGifts,
      giftCount: gifts.length,
      totalGiving,
      largestGift,
      firstGiftDate: oldestFirst[0].date,
      lastGiftDate: sortedGifts[0].date,
      recurringGifts,
      pledges,
      reConstituentId: "CNST-" + (100000 + Math.floor(rand() * 899999)),
      reSynced,
    });
  }
  return donors;
}
const MOCK_DONORS = buildDonors();

/* ============================================================
   SHARED CHECKOUT STATE HOOK
   ============================================================ */
function useCheckout(org) {
  const [step, setStep] = useState(1);
  const [amount, setAmount] = useState(org.amounts[1]);
  const [customAmount, setCustomAmount] = useState("");
  const [frequency, setFrequency] = useState("one_time");
  const [designationId, setDesignationId] = useState(org.designations[0].id);
  const [otherText, setOtherText] = useState("");
  const [firstName, setFirstName] = useState("");
  const [lastName, setLastName] = useState("");
  const [email, setEmail] = useState("");
  const [feeCover, setFeeCover] = useState(false);
  const [anonymous, setAnonymous] = useState(false);
  const [tributeOn, setTributeOn] = useState(false);
  const [comments, setComments] = useState("");
  const [submitting, setSubmitting] = useState(false);
  const [submitted, setSubmitted] = useState(false);
  const [splitAlloc, setSplitAlloc] = useState(() =>
    Object.fromEntries(org.designations.map((d) => [d.id, 0]))
  );

  const chosenAmount = customAmount ? Number(customAmount) || 0 : amount;
  const feeAmount = feeCover ? Math.round(chosenAmount * 0.029 + 0.3) : 0;
  const total = chosenAmount + feeAmount;
  const splitTotal = Object.values(splitAlloc).reduce((a, b) => a + Number(b || 0), 0);

  function goNext() { setStep((s) => Math.min(3, s + 1)); }
  function goBack() { setStep((s) => Math.max(1, s - 1)); }
  function submit() {
    setSubmitting(true);
    setTimeout(() => { setSubmitting(false); setSubmitted(true); setStep(3); }, 900);
  }
  function reset() {
    setStep(1); setSubmitted(false); setFirstName(""); setLastName(""); setEmail("");
    setCustomAmount(""); setAmount(org.amounts[1]);
  }

  return {
    step, setStep, goNext, goBack,
    amount, setAmount, customAmount, setCustomAmount, chosenAmount,
    frequency, setFrequency,
    designationId, setDesignationId, otherText, setOtherText,
    firstName, setFirstName, lastName, setLastName, email, setEmail,
    feeCover, setFeeCover, feeAmount, total,
    anonymous, setAnonymous, tributeOn, setTributeOn, comments, setComments,
    submitting, submitted, submit, reset,
    splitAlloc, setSplitAlloc, splitTotal,
  };
}

const FREQ_LABEL = { one_time: "One time", monthly: "Monthly", quarterly: "Quarterly", annual: "Annual" };
</script>
<script type="text/plain" data-module="app-templates.js">
/* ============================================================
   SHARED CONFIRMATION PANEL
   ============================================================ */
function ConfirmPanel({ checkout, org, accent, label }) {
  const amt = checkout.total;
  return (
    <div className="ge-confirm-wrap">
      <div className="ge-confirm-check" style={{ background: accent || "#16A34A" }}>&#10003;</div>
      <h2>Thank you, {checkout.firstName || "friend"}!</h2>
      <div className="ge-confirm-amt" style={{ color: accent }}>{fmtMoney(amt)}</div>
      <p>
        Your {FREQ_LABEL[checkout.frequency].toLowerCase()} gift to {org.name} is complete.
        A receipt has been emailed to {checkout.email || "your inbox"}.
        {checkout.frequency !== "one_time" ? " Your first installment processes immediately." : ""}
      </p>
      <button className="ge-btn ge-btn-ghost ge-btn-sm" onClick={checkout.reset}>Make another gift</button>
    </div>
  );
}

function ProgressDots({ step, count = 3, color }) {
  return (
    <div style={{ display: "flex", gap: 6, marginBottom: 18 }}>
      {Array.from({ length: count }).map((_, i) => (
        <div key={i} style={{ flex: 1, height: 4, borderRadius: 100, background: i < step ? color : "#E4E7EC" }} />
      ))}
    </div>
  );
}

/* ============================================================
   1. CLASSIC NXT
   ============================================================ */
function ClassicNXT({ org }) {
  const c = useCheckout(org);
  const other = org.designations.find((d) => d.id === "other");
  return (
    <div className="tmpl-classic">
      <div className="wrap">
        <div className="hdr">
          <div className="logo">{org.initials}</div>
          <div><h1>{org.name}</h1><p>Secure Online Giving</p></div>
        </div>
        <div className="progress">
          {[1, 2, 3].map((n) => <div key={n} className={c.step >= n ? "on" : ""} />)}
        </div>
        <div className="body">
          {c.step === 1 && (
            <React.Fragment>
              <div className="field-block">
                <label className="section-label">Designation</label>
                <select value={c.designationId} onChange={(e) => c.setDesignationId(e.target.value)}>
                  {org.designations.map((d) => <option key={d.id} value={d.id}>{d.name}</option>)}
                </select>
                {other && c.designationId === "other" && (
                  <input type="text" placeholder="Please specify a fund" style={{ marginTop: 10 }}
                    value={c.otherText} onChange={(e) => c.setOtherText(e.target.value)} />
                )}
              </div>
              <div className="field-block">
                <label className="section-label">Gift amount</label>
                <div className="amount-grid">
                  {org.amounts.map((a) => (
                    <button key={a} className={"amount-btn" + (!c.customAmount && c.amount === a ? " on" : "")}
                      onClick={() => { c.setAmount(a); c.setCustomAmount(""); }}>{fmtMoney(a)}</button>
                  ))}
                </div>
                <input type="text" placeholder="Other amount" style={{ marginTop: 10 }}
                  value={c.customAmount} onChange={(e) => c.setCustomAmount(e.target.value.replace(/[^0-9]/g, ""))} />
                <div className="freq-row">
                  {Object.keys(FREQ_LABEL).map((f) => (
                    <button key={f} className={c.frequency === f ? "on" : ""} onClick={() => c.setFrequency(f)}>{FREQ_LABEL[f]}</button>
                  ))}
                </div>
                {c.frequency !== "one_time" && <div className="foot-note">Your first gift will process immediately.</div>}
              </div>
              <button className="submit-btn" onClick={c.goNext}>Continue</button>
            </React.Fragment>
          )}
          {c.step === 2 && (
            <React.Fragment>
              <div className="field-block">
                <label className="section-label">Donor information</label>
                <div className="row2">
                  <div><span className="fieldlabel">First name *</span><input type="text" value={c.firstName} onChange={(e) => c.setFirstName(e.target.value)} /></div>
                  <div><span className="fieldlabel">Last name *</span><input type="text" value={c.lastName} onChange={(e) => c.setLastName(e.target.value)} /></div>
                </div>
                <span className="fieldlabel" style={{ marginTop: 10 }}>Email *</span>
                <input type="email" value={c.email} onChange={(e) => c.setEmail(e.target.value)} />
                <label className="checkline"><input type="checkbox" checked={c.anonymous} onChange={(e) => c.setAnonymous(e.target.checked)} /> Make this gift anonymous</label>
                <label className="checkline"><input type="checkbox" checked={c.tributeOn} onChange={(e) => c.setTributeOn(e.target.checked)} /> Give in honor or memory of someone</label>
                {c.tributeOn && (
                  <div className="row2" style={{ marginTop: 8 }}>
                    <input type="text" placeholder="Honoree first name" />
                    <input type="text" placeholder="Honoree last name" />
                  </div>
                )}
              </div>
              <div className="field-block">
                <label className="section-label">Payment</label>
                <input type="text" placeholder="Card number" defaultValue="4242 4242 4242 4242" />
                <div className="row2" style={{ marginTop: 8 }}>
                  <input type="text" placeholder="MM / YY" defaultValue="04 / 29" />
                  <input type="text" placeholder="CVC" defaultValue="123" />
                </div>
                <label className="checkline"><input type="checkbox" checked={c.feeCover} onChange={(e) => c.setFeeCover(e.target.checked)} /> Add {fmtMoney(Math.round(c.chosenAmount * 0.029 + 0.3))} so 100% of my gift reaches {org.name}</label>
              </div>
              <button className="submit-btn" onClick={c.submit} disabled={c.submitting}>
                {c.submitting ? "Processing\u2026" : `Give ${fmtMoney(c.total)} now`}
              </button>
              <div className="foot-note" onClick={c.goBack} style={{ cursor: "pointer" }}>&larr; Back</div>
            </React.Fragment>
          )}
          {c.step === 3 && <ConfirmPanel checkout={c} org={org} accent="#1B4B8F" />}
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   2. MINIMAL CHECKOUT
   ============================================================ */
function MinimalCheckout({ org }) {
  const c = useCheckout(org);
  return (
    <div className="tmpl-minimal">
      <div className="wrap">
        <div className="badge">{org.initials}</div>
        <ProgressDots step={c.step} color="#FF6B4A" />
        {c.step === 1 && (
          <React.Fragment>
            <h1>Support {org.name}</h1>
            <p className="sub">Every gift helps a young person in our community.</p>
            <div className="freq-pill-row">
              {["one_time", "monthly"].map((f) => (
                <button key={f} className={c.frequency === f ? "on" : ""} onClick={() => c.setFrequency(f)}>{FREQ_LABEL[f]} gift</button>
              ))}
            </div>
            <div className="amount-grid">
              {org.amounts.map((a) => (
                <button key={a} className={"amount-btn" + (!c.customAmount && c.amount === a ? " on" : "")}
                  onClick={() => { c.setAmount(a); c.setCustomAmount(""); }}>{fmtMoney(a)}</button>
              ))}
            </div>
            <input type="text" placeholder="Custom amount" value={c.customAmount}
              onChange={(e) => c.setCustomAmount(e.target.value.replace(/[^0-9]/g, ""))} />
            <select value={c.designationId} onChange={(e) => c.setDesignationId(e.target.value)}>
              {org.designations.map((d) => <option key={d.id} value={d.id}>{d.name}</option>)}
            </select>
            <button className="submit-btn" onClick={c.goNext}>Continue &rarr;</button>
          </React.Fragment>
        )}
        {c.step === 2 && (
          <React.Fragment>
            <h1>Almost there</h1>
            <p className="sub">{fmtMoney(c.chosenAmount)} {FREQ_LABEL[c.frequency].toLowerCase()} to {org.name}</p>

            <input type="text" placeholder="Last name" value={c.lastName} onChange={(e) => c.setLastName(e.target.value)} />

            <input type="text" placeholder="Card number" defaultValue="4242 4242 4242 4242" />
            <label className="checkline"><input type="checkbox" checked={c.feeCover} onChange={(e) => c.setFeeCover(e.target.checked)} /> Cover the {fmtMoney(Math.round(c.chosenAmount * 0.029 + 0.3))} processing fee</label>
            <button className="submit-btn" onClick={c.submit} disabled={c.submitting}>
              {c.submitting ? "Processing\u2026" : `Donate ${fmtMoney(c.total)}`}
            </button>
            <div className="trust-row" onClick={c.goBack} style={{ cursor: "pointer" }}>&larr; BACK &nbsp; · &nbsp; SECURE CHECKOUT</div>
          </React.Fragment>
        )}
        {c.step === 3 && <ConfirmPanel checkout={c} org={org} accent="#FF6B4A" />}
      </div>
    </div>

   3. STORY PAGE

        </div>
        <div className="give-card">

            <React.Fragment>
              <h2>Make a gift</h2>
              <div className="designation-list">
                {org.designations.map((d) => (
                  <div key={d.id} className={"desig-opt" + (c.designationId === d.id ? " on" : "")}
                    onClick={() => c.setDesignationId(d.id)}>{d.name}</div>
                ))}
              </div>
              <div className="amount-grid">
                {org.amounts.map((a) => (
                  <button key={a} className={"amount-btn" + (!c.customAmount && c.amount === a ? " on" : "")}

                  <button className="submit-btn" onClick={c.submit} disabled={c.submitting}>
                    {c.submitting ? "Processing\u2026" : `Give ${fmtMoney(c.chosenAmount)} now`}

                  <div style={{ textAlign: "center", marginTop: 10, fontSize: 12.5, color: "#6A6086", cursor: "pointer" }} onClick={c.goBack}>&larr; Back</div>

              {c.step === 3 && <ConfirmPanel checkout={c} org={org} accent="#6D4AFF" />}

/* ============================================================
   5. SPLIT DESIGNATION
   ============================================================ */
function SplitDesignation({ org }) {
  const c = useCheckout(org);
  const [splitMode, setSplitMode] = useState(false);

  function setAlloc(id, val) {
    c.setSplitAlloc((s) => ({ ...s, [id]: val.replace(/[^0-9]/g, "") }));
  }

  return (
    <div className="tmpl-split">
      <div className="wrap">
        <div className="hdr">
          <h1>{org.name}</h1>
          <p>Direct your gift to one fund, or split it across several.</p>
        </div>
        <div className="body">
          {c.step === 1 && (
            <React.Fragment>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
                <span style={{ fontWeight: 700, fontSize: 13.5, color: "#1B2A4A" }}>
                  {splitMode ? "Allocate your gift" : "Choose a fund"}
                </span>
                <button className="ge-btn ge-btn-ghost ge-btn-sm" onClick={() => setSplitMode((v) => !v)}>
                  {splitMode ? "Give to one fund instead" : "Split across multiple funds"}
                </button>
              </div>
              {!splitMode && (
                <div className="desig-table">
                  {org.designations.map((d) => (
                    <div key={d.id} className={"desig-row" + (c.designationId === d.id ? " on" : "")}
                      onClick={() => c.setDesignationId(d.id)} style={{ cursor: "pointer" }}>
                      <div className="name">{d.name}{d.desc && <span>{d.desc}</span>}</div>
                    </div>
                  ))}
                </div>
              )}
              {splitMode && (
                <div className="desig-table">
                  {org.designations.map((d) => (
                    <div key={d.id} className={"desig-row" + (Number(c.splitAlloc[d.id]) > 0 ? " on" : "")}>
                      <div className="name">{d.name}{d.desc && <span>{d.desc}</span>}</div>
                      <input type="number" placeholder="$0" value={c.splitAlloc[d.id] || ""} onChange={(e) => setAlloc(d.id, e.target.value)} />
                    </div>
                  ))}
                </div>
              )}
              {!splitMode && (
                <div className="amount-grid" style={{ display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: 9, marginBottom: 16 }}>
                  {org.amounts.map((a) => (
                    <button key={a} className={"amount-btn" + (!c.customAmount && c.amount === a ? " on" : "")}
                      style={{ border: "1.5px solid #EFE3D6", borderRadius: 8, padding: "11px 4px", fontWeight: 700, background: (!c.customAmount && c.amount === a) ? "#C1440E" : "#fff", color: (!c.customAmount && c.amount === a) ? "#fff" : "#1B2A4A" }}
                      onClick={() => { c.setAmount(a); c.setCustomAmount(""); }}>{fmtMoney(a)}</button>
                  ))}
                </div>
              )}
              <div className="split-total">
                <span>Total gift</span>
                <span className="amt">{fmtMoney(splitMode ? c.splitTotal : (c.customAmount || c.amount))}</span>
              </div>
              <div className="freq-row">
                {["one_time", "monthly", "quarterly"].map((f) => (
                  <button key={f} className={c.frequency === f ? "on" : ""} onClick={() => c.setFrequency(f)}>{FREQ_LABEL[f]}</button>
                ))}
              </div>
              <button className="submit-btn" onClick={c.goNext}>Continue</button>
            </React.Fragment>
          )}
          {c.step === 2 && (
            <React.Fragment>
              <div className="row2">
                <input type="text" placeholder="First name" value={c.firstName} onChange={(e) => c.setFirstName(e.target.value)} />
                <input type="text" placeholder="Last name" value={c.lastName} onChange={(e) => c.setLastName(e.target.value)} />
              </div>
              <input type="email" placeholder="Email" value={c.email} onChange={(e) => c.setEmail(e.target.value)} />
              <input type="text" placeholder="Card number" defaultValue="4242 4242 4242 4242" />
              <label style={{ display: "flex", gap: 8, fontSize: 13, color: "#5B5347", margin: "6px 0 14px" }}>
                <input type="checkbox" checked={c.feeCover} onChange={(e) => c.setFeeCover(e.target.checked)} />
                Add {fmtMoney(Math.round((splitMode ? c.splitTotal : c.chosenAmount) * 0.029 + 0.3))} to cover processing fees
              </label>
              <button className="submit-btn" onClick={c.submit} disabled={c.submitting}>
                {c.submitting ? "Processing\u2026" : `Give ${fmtMoney(splitMode ? c.splitTotal : c.total)} now`}
              </button>
              <div style={{ textAlign: "center", marginTop: 10, fontSize: 12.5, color: "#8A8578", cursor: "pointer" }} onClick={c.goBack}>&larr; Back</div>
            </React.Fragment>
          )}
          {c.step === 3 && <ConfirmPanel checkout={c} org={org} accent="#C1440E" />}
        </div>
      </div>
    </div>
  );
}

<script type="text/plain" data-module="app-admin.js">
/* ============================================================
   GIFT HISTORY
   ============================================================ */
function StatPill({ status }) {
  const map = { settled: "Settled", pending: "Pending", failed: "Failed", refunded: "Refunded" };
  return <span className={"ge-pill ge-pill-" + status}>{map[status]}</span>;
}
function TypeLabel({ type }) {
  const map = { one_time: "One-time", recurring: "Recurring", pledge_payment: "Pledge payment" };
  return <span>{map[type]}</span>;
}

function GiftDetailModal({ gift, onClose }) {
  return (
    <div className="tmpl-modal-overlay" onClick={(e) => e.target === e.currentTarget && onClose()}>
      <div className="tmpl-modal-panel" style={{ maxWidth: 420 }}>
        <div className="mhdr"><b style={{ fontWeight: 700 }}>{gift.id}</b><button className="x" onClick={onClose}>&times;</button></div>
        <div className="mbody">
          <div style={{ fontSize: 28, fontWeight: 800, fontFamily: "Sora, sans-serif", marginBottom: 4 }}>{fmtMoney(gift.amount)}</div>
          <div style={{ marginBottom: 16 }}><StatPill status={gift.status} /></div>
          {[["Donor", gift.donor], ["Email", gift.email], ["Type", <TypeLabel type={gift.type} />], ["Designation", gift.designation], ["Date", gift.date], ["Rainforest transaction", gift.txId], ["RE NXT sync", gift.synced ? "Synced" : "Pending"]].map(([k, v]) => (
            <div key={k} style={{ display: "flex", justifyContent: "space-between", padding: "9px 0", borderBottom: "1px solid #F0F2F5", fontSize: 13.5 }}>
              <span style={{ color: "#98A2B3" }}>{k}</span><span style={{ fontWeight: 600 }}>{v}</span>
            </div>
          ))}
          <div style={{ display: "flex", gap: 8, marginTop: 18 }}>
            <button className="ge-btn ge-btn-ghost ge-btn-sm">Resend receipt</button>
            <button className="ge-btn ge-btn-ghost ge-btn-sm">Refund</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function GiftHistory() {
  const [q, setQ] = useState("");
  const [status, setStatus] = useState("all");
  const [type, setType] = useState("all");
  const [sort, setSort] = useState("date_desc");
  const [selected, setSelected] = useState(null);

  const filtered = useMemo(() => {
    let rows = MOCK_GIFTS.filter((g) => {
      if (status !== "all" && g.status !== status) return false;
      if (type !== "all" && g.type !== type) return false;
      if (q && !(g.donor.toLowerCase().includes(q.toLowerCase()) || g.email.toLowerCase().includes(q.toLowerCase()) || g.id.toLowerCase().includes(q.toLowerCase()))) return false;
      return true;
    });
    if (sort === "date_desc") rows = [...rows].sort((a, b) => b.date.localeCompare(a.date));
    if (sort === "date_asc") rows = [...rows].sort((a, b) => a.date.localeCompare(b.date));
    if (sort === "amount_desc") rows = [...rows].sort((a, b) => b.amount - a.amount);
    return rows;
  }, [q, status, type, sort]);

  const totals = useMemo(() => {
    const settled = MOCK_GIFTS.filter((g) => g.status === "settled");
    const sum = settled.reduce((a, g) => a + g.amount, 0);
    const recurring = MOCK_GIFTS.filter((g) => g.type === "recurring").length;
    const failedCount = MOCK_GIFTS.filter((g) => g.status === "failed").length;
    return { sum, count: settled.length, recurring, failedCount };
  }, []);

  return (
    <div>
      <div className="ge-page-head">
        <div className="ge-eyebrow">Admin Console</div>
        <h1>Gift history</h1>
        <p>Search, filter, and review every gift across all forms and templates. Every settled gift links to its Rainforest transaction ID and RE NXT sync status.</p>
      </div>

      <div className="ge-stat-row">
        <div className="ge-stat"><div className="ge-stat-label">Total raised (settled)</div><div className="ge-stat-value">{fmtMoney(totals.sum)}</div><div className="ge-stat-sub">Last 45 days</div></div>
        <div className="ge-stat"><div className="ge-stat-label">Settled gifts</div><div className="ge-stat-value">{totals.count}</div></div>
        <div className="ge-stat"><div className="ge-stat-label">Active recurring installments</div><div className="ge-stat-value">{totals.recurring}</div></div>
        <div className="ge-stat"><div className="ge-stat-label">Failed charges</div><div className="ge-stat-value" style={{ color: totals.failedCount ? "#C41E3A" : "#1A2027" }}>{totals.failedCount}</div><div className="ge-stat-sub" style={{ color: "#B54708" }}>Needs review</div></div>
      </div>

      <div className="ge-card">
        <div className="ge-card-pad" style={{ paddingBottom: 0 }}>
          <div className="ge-toolbar">
            <div className="ge-search"><input placeholder="Search donor name, email, or gift ID…" value={q} onChange={(e) => setQ(e.target.value)} /></div>
            <select className="ge-select" value={status} onChange={(e) => setStatus(e.target.value)}>
              <option value="all">All statuses</option>
              <option value="settled">Settled</option>
              <option value="pending">Pending</option>
              <option value="failed">Failed</option>
              <option value="refunded">Refunded</option>
            </select>
            <select className="ge-select" value={type} onChange={(e) => setType(e.target.value)}>
              <option value="all">All gift types</option>
              <option value="one_time">One-time</option>
              <option value="recurring">Recurring</option>
              <option value="pledge_payment">Pledge payment</option>
            </select>
            <select className="ge-select" value={sort} onChange={(e) => setSort(e.target.value)}>
              <option value="date_desc">Newest first</option>
              <option value="date_asc">Oldest first</option>
              <option value="amount_desc">Amount: high to low</option>
            </select>
            <button className="ge-btn ge-btn-ghost ge-btn-sm">Export CSV</button>
          </div>
        </div>
        <div style={{ overflowX: "auto" }}>
          <table className="ge-table">
            <thead>
              <tr>
                <th>Gift ID</th><th>Donor</th><th>Amount</th><th>Type</th><th>Designation</th><th>Date</th><th>Status</th><th>RE NXT</th>
              </tr>
            </thead>
            <tbody>
              {filtered.slice(0, 20).map((g) => (
                <tr key={g.id} onClick={() => setSelected(g)} style={{ cursor: "pointer" }}>
                  <td className="ge-mono">{g.id}</td>
                  <td><b>{g.donor}</b><div style={{ fontSize: 12, color: "#98A2B3" }}>{g.email}</div></td>
                  <td><b>{fmtMoney(g.amount)}</b></td>
                  <td><TypeLabel type={g.type} /></td>
                  <td>{g.designation}</td>
                  <td>{g.date}</td>
                  <td><StatPill status={g.status} /></td>
                  <td>{g.synced ? <span style={{ color: "#16A34A", fontWeight: 700, fontSize: 12.5 }}>Synced</span> : <span style={{ color: "#B54708", fontWeight: 700, fontSize: 12.5 }}>Pending</span>}</td>
                </tr>
              ))}
            </tbody>
          </table>
          {filtered.length === 0 && <div style={{ padding: 40, textAlign: "center", color: "#98A2B3" }}>No gifts match these filters.</div>}
        </div>
        <div style={{ padding: "12px 20px", fontSize: 12.5, color: "#98A2B3" }}>Showing {Math.min(20, filtered.length)} of {filtered.length} gifts</div>
      </div>

      {selected && <GiftDetailModal gift={selected} onClose={() => setSelected(null)} />}
    </div>
  );
}

/* ============================================================
   DONORS
   ============================================================ */
function ReSyncLabel({ status }) {
  const map = {
    synced: { text: "Synced", color: "#16A34A" },
    partial: { text: "Partially synced", color: "#B54708" },
    pending: { text: "Not synced", color: "#C41E3A" },
  };
  const m = map[status] || map.pending;
  return <span style={{ color: m.color, fontWeight: 700, fontSize: 12.5 }}>{m.text}</span>;
}

function kvRow(k, v) {
  return (
    <div key={k} style={{ display: "flex", justifyContent: "space-between", padding: "9px 0", borderBottom: "1px solid #F0F2F5", fontSize: 13.5, gap: 12 }}>
      <span style={{ color: "#98A2B3", flexShrink: 0 }}>{k}</span><span style={{ fontWeight: 600, textAlign: "right" }}>{v}</span>
    </div>
  );
}

function DonorDirectory() {
  const [q, setQ] = useState("");
  const [filter, setFilter] = useState("all");
  const [sort, setSort] = useState("total_desc");
  const [selectedId, setSelectedId] = useState(null);

  const filtered = useMemo(() => {
    let rows = MOCK_DONORS.filter((d) => {
      if (filter === "recurring" && !d.recurringGifts.some((r) => r.status === "active")) return false;
      if (filter === "pledge" && !d.pledges.some((p) => p.balance > 0)) return false;
      if (filter === "unsynced" && d.reSynced === "synced") return false;
      if (q) {
        const needle = q.toLowerCase();
        if (!(d.name.toLowerCase().includes(needle) || d.email.toLowerCase().includes(needle) || d.reConstituentId.toLowerCase().includes(needle))) return false;
      }
      return true;
    });
    if (sort === "total_desc") rows = [...rows].sort((a, b) => b.totalGiving - a.totalGiving);
    if (sort === "recent") rows = [...rows].sort((a, b) => b.lastGiftDate.localeCompare(a.lastGiftDate));
    if (sort === "name_asc") rows = [...rows].sort((a, b) => a.name.localeCompare(b.name));
    return rows;
  }, [q, filter, sort]);

  const totals = useMemo(() => {
    const totalGiven = MOCK_DONORS.reduce((a, d) => a + d.totalGiving, 0);
    const recurringCount = MOCK_DONORS.filter((d) => d.recurringGifts.some((r) => r.status === "active")).length;
    const unsyncedCount = MOCK_DONORS.filter((d) => d.reSynced !== "synced").length;
    return { count: MOCK_DONORS.length, totalGiven, recurringCount, unsyncedCount };
  }, []);

  if (selectedId) return <DonorProfile donorId={selectedId} onBack={() => setSelectedId(null)} />;

  return (
    <div>
      <div className="ge-page-head">
        <div className="ge-eyebrow">Admin Console</div>
        <h1>Donors</h1>
        <p>Every individual who has given, with full giving history, active recurring gifts and pledges, and RE NXT sync status in one place.</p>
      </div>

      <div className="ge-stat-row">
        <div className="ge-stat"><div className="ge-stat-label">Total donors</div><div className="ge-stat-value">{totals.count}</div></div>
        <div className="ge-stat"><div className="ge-stat-label">Lifetime giving</div><div className="ge-stat-value">{fmtMoney(totals.totalGiven)}</div></div>
        <div className="ge-stat"><div className="ge-stat-label">Active recurring donors</div><div className="ge-stat-value">{totals.recurringCount}</div></div>
        <div className="ge-stat"><div className="ge-stat-label">Not synced to RE NXT</div><div className="ge-stat-value" style={{ color: totals.unsyncedCount ? "#C41E3A" : "#1A2027" }}>{totals.unsyncedCount}</div></div>
      </div>

      <div className="ge-card">
        <div className="ge-card-pad" style={{ paddingBottom: 0 }}>
          <div className="ge-toolbar">
            <div className="ge-search"><input placeholder="Search donor name, email, or constituent ID…" value={q} onChange={(e) => setQ(e.target.value)} /></div>
            <select className="ge-select" value={filter} onChange={(e) => setFilter(e.target.value)}>
              <option value="all">All donors</option>
              <option value="recurring">Has active recurring gift</option>
              <option value="pledge">Has open pledge balance</option>
              <option value="unsynced">Not fully synced to RE NXT</option>
            </select>
            <select className="ge-select" value={sort} onChange={(e) => setSort(e.target.value)}>
              <option value="total_desc">Total giving: high to low</option>
              <option value="recent">Most recent gift</option>
              <option value="name_asc">Name: A to Z</option>
            </select>
            <button className="ge-btn ge-btn-ghost ge-btn-sm">Export CSV</button>
          </div>
        </div>
        <div style={{ overflowX: "auto" }}>
          <table className="ge-table">
            <thead>
              <tr>
                <th>Donor</th><th>Total giving</th><th>Gifts</th><th>Last gift</th><th>Recurring</th><th>Pledge</th><th>RE NXT</th>
              </tr>
            </thead>
            <tbody>
              {filtered.map((d) => (
                <tr key={d.id} onClick={() => setSelectedId(d.id)} style={{ cursor: "pointer" }}>
                  <td><b>{d.name}</b><div style={{ fontSize: 12, color: "#98A2B3" }}>{d.email}</div></td>
                  <td><b>{fmtMoney(d.totalGiving)}</b></td>
                  <td>{d.giftCount}</td>
                  <td>{d.lastGiftDate}</td>
                  <td>{d.recurringGifts.some((r) => r.status === "active") ? <span style={{ color: "#16A34A", fontWeight: 700, fontSize: 12.5 }}>Active</span> : <span style={{ color: "#98A2B3", fontSize: 12.5 }}>—</span>}</td>
                  <td>{d.pledges.some((p) => p.balance > 0) ? <span style={{ color: "#B54708", fontWeight: 700, fontSize: 12.5 }}>{fmtMoney(d.pledges[0].balance)} due</span> : <span style={{ color: "#98A2B3", fontSize: 12.5 }}>—</span>}</td>
                  <td><ReSyncLabel status={d.reSynced} /></td>
                </tr>
              ))}
            </tbody>
          </table>
          {filtered.length === 0 && <div style={{ padding: 40, textAlign: "center", color: "#98A2B3" }}>No donors match these filters.</div>}
        </div>
        <div style={{ padding: "12px 20px", fontSize: 12.5, color: "#98A2B3" }}>Showing {filtered.length} of {MOCK_DONORS.length} donors</div>
      </div>
    </div>
  );
}

function DonorProfile({ donorId, onBack }) {
  const donor = MOCK_DONORS.find((d) => d.id === donorId);
  const [selectedGift, setSelectedGift] = useState(null);
  if (!donor) return null;

  return (
    <div>
      <button className="ge-btn ge-btn-ghost ge-btn-sm" style={{ marginBottom: 18 }} onClick={onBack}>&larr; All donors</button>
      <div className="ge-page-head" style={{ marginBottom: 22 }}>
        <div className="ge-eyebrow">Admin Console &middot; Donors</div>
        <h1>{donor.name}</h1>

      </div>

      {selectedGift && <GiftDetailModal gift={selectedGift} onClose={() => setSelectedGift(null)} />}
    </div>
  );

const ONB_STEPS = ["Organization", "Controller", "Bank account", "Documents", "Review"];

  const [step, setStep] = useState(0);

  return (
    <div className="ge-onb-wrap">
      <div className="ge-rf-badge">&#127796; Embedded via Rainforest — you never leave AppsNXT</div>

        <div className="ge-onb-steps">

            <React.Fragment key={label}>
              <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 6 }}>
                <div className={"ge-onb-step-dot " + (i < step ? "done" : i === step ? "current" : "")}>{i < step ? "\u2713" : i + 1}</div>
                <div style={{ fontSize: 10.5, color: "#98A2B3", fontWeight: 600, whiteSpace: "nowrap" }}>{label}</div>
              </div>
              {i < ONB_STEPS.length - 1 && <div className={"ge-onb-step-line " + (i < step ? "done" : "")} />}

              {[["Organization", "Riverbend Humane Society"], ["EIN", "47-1928374"], ["Controller", "Dana Whitfield, Executive Director"], ["Payout account", "First Traverse Credit Union \u2022\u2022\u2022\u2022"], ["Documents", "2 of 2 attached"]].map(([k, v]) => (
                <div key={k} style={{ display: "flex", justifyContent: "space-between", padding: "10px 0", borderBottom: "1px solid #F0F2F5", fontSize: 13.5 }}>
                  <span style={{ color: "#98A2B3" }}>{k}</span><span style={{ fontWeight: 600 }}>{v}</span>
                </div>
              ))}
            </React.Fragment>
          )}
          <div className="ge-onb-foot">
            <button className="ge-btn ge-btn-ghost" onClick={back} disabled={step === 0} style={{ opacity: step === 0 ? 0.4 : 1 }}>Back</button>
            <button className="ge-btn ge-btn-primary" onClick={next}>{step === ONB_STEPS.length - 1 ? "Submit application" : "Continue"}</button>
          </div>
        </div>
      )}
    </div>
  );
}
</script>
<script type="text/plain" data-module="app-shell.js">
function TopNav({ view, setView }) {
  const tabs = [
    { id: "donor", label: "Donor Checkout" },
    { id: "admin", label: "Admin Console" },
    { id: "onboarding", label: "Merchant Onboarding" },
  ];
  return (
    <div className="ge-topnav">
      <div className="ge-brand">
        <div className="ge-brand-mark">GE</div>
        Giving Engine
        <span className="ge-brand-sub">Interactive Prototype</span>
      </div>
      <div className="ge-tabs">
        {tabs.map((t) => (
          <button key={t.id} className={"ge-tab" + (view === t.id ? " active" : "")} onClick={() => setView(t.id)}>{t.label}</button>
        ))}
      </div>
    </div>
  );
}

function TemplateGallery({ onOpen }) {
  return (
    <div className="ge-container">
      <div className="ge-page-head">
        <div className="ge-eyebrow">Donor Checkout</div>
        <h1>Five checkout templates, one engine</h1>
        <p>Every template below shares the same checkout logic, field configuration, and payment flow — only the layout and visual style change. Click any card to try the live, interactive flow as a donor would see it.</p>
      </div>
      <div className="ge-gallery-grid">
        {TEMPLATE_ORDER.map((id) => {
          const org = ORGS[id];
          return (
            <button key={id} className="ge-tmpl-card" onClick={() => onOpen(id)}>
              <div className="ge-tmpl-thumb" style={{ background: org.thumbGrad, display: "flex", alignItems: "center", justifyContent: "center" }}>
                <div style={{ color: "#fff", fontFamily: "Sora, sans-serif", fontSize: 15, fontWeight: 700, opacity: 0.92, textAlign: "center", padding: "0 20px" }}>
                  {org.tmplName}
                </div>
              </div>
              <div className="ge-tmpl-body">
                <div className="ge-tmpl-org" style={{ color: "#667085" }}>{org.name}</div>
                <div className="ge-tmpl-name">{org.tmplName}</div>
                <p className="ge-tmpl-desc">{org.tmplDesc}</p>
                <div className="ge-tmpl-tags">
                  <span className="ge-tag">One-time + recurring</span>
                  <span className="ge-tag">Live demo</span>
                </div>
              </div>
            </button>
          );
        })}
      </div>
    </div>
  );
}

function CheckoutView({ templateId, onBack }) {
  const org = ORGS[templateId];
  const Comp = TEMPLATE_COMPONENTS[templateId];
  return (
    <div>
      <div className="ge-backbar">
        <button className="ge-btn ge-btn-ghost ge-btn-sm" onClick={onBack}>&larr; All templates</button>
        <b>{org.tmplName}</b><span>&mdash; {org.name} (demo data, no real payment)</span>
      </div>
      <div className="ge-checkout-stage">
        <Comp org={org} key={templateId} />
      </div>
    </div>
  );
}

function AdminConsole() {
  const [page, setPage] = useState("gifts");
  const items = [
    { section: "Overview", items: [["gifts", "Gift history"], ["donors", "Donors"]] },
    { section: "Forms", items: [["builder", "Form builder"], ["branding", "Branding"]] },
    { section: "Payments", items: [["merchant", "Payment processing"]] },
  ];
  return (
    <div className="ge-admin-shell">
      <div className="ge-admin-side">
        {items.map((sec) => (
          <div key={sec.section}>
            <div className="ge-admin-side-label">{sec.section}</div>
            {sec.items.map(([id, label]) => (
              <button key={id} className={"ge-admin-side-item" + (page === id ? " active" : "")} onClick={() => setPage(id)}>{label}</button>
            ))}
          </div>
        ))}
      </div>
      <div className="ge-admin-content">
        {page === "gifts" && <GiftHistory />}
        {page === "donors" && <DonorDirectory />}
        {page === "builder" && <FormBuilder />}
        {page === "branding" && <Branding />}
        {page === "merchant" && <MerchantAccountSummary goOnboard={() => setPage("__onb")} />}
        {page === "__onb" && <OnboardingWizard />}
      </div>
    </div>
  );
}

function App() {
  const [view, setView] = useState("donor");
  const [template, setTemplate] = useState(null);

  function goView(v) { setView(v); if (v !== "donor") setTemplate(null); }

  return (
    <div className="ge-app">
      <TopNav view={view} setView={goView} />
      <div className="ge-main">
        {view === "donor" && (template ? <CheckoutView templateId={template} onBack={() => setTemplate(null)} /> : <TemplateGallery onOpen={setTemplate} />)}
        {view === "admin" && <AdminConsole />}
        {view === "onboarding" && <OnboardingWizard />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<script>
(function() {
  var mods = document.querySelectorAll('script[type="text/plain"][data-module]');
  mods.forEach(function(mod) {
    var name = mod.getAttribute('data-module');
    var src = mod.textContent;
    try {
      var out = Babel.transform(src, {
        presets: [["react", { runtime: "classic" }]],
        filename: name
      }).code;
      var s = document.createElement('script');
      s.text = out;
      document.body.appendChild(s);
    } catch (e) {
      console.error("Error in " + name + ":", e);
      var pre = document.createElement('pre');
      pre.style.cssText = 'padding:20px;color:#b00;background:#fff0f0;white-space:pre-wrap;font-family:monospace;';
      pre.textContent = "Error loading " + name + ":\n" + e.message + "\n\n" + (e.stack || '');
      document.body.appendChild(pre);
    }
  });
})();
</script>
</body>
</html>
